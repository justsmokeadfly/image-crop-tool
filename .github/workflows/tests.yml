name: Tests

on:
  push:
    branches: [main, v1.9]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application modules
        run: python -m py_compile app.py app_v3.py clean_zip.py

      - name: Run tests
        run: python -m pytest -q
